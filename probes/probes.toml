[defaults]
max_tokens = 24000
timeout_ms = 240000
enforce = true
context_chars = 60000
retry_context_chars = 8000

[probe.judge]
dispatch_chars = 16000
fail_closed = true
# Судья решает, осталось ли внутри задачи решение. В 381 диспатче из 500
# (замер 2026-08-29, Catalyst-Judge-Eval) сама задача лежит в .md-файле, а
# диспатч несёт только указатель — и судья судил указатель. Настройка
# ПОИМЁННАЯ: ядро проб общее с наблюдателем флота, у которого в нагрузке путей
# нет, поэтому умолчание ядра — ноль, и включается это здесь.
# Числа — замер по 500 живым записям судьи (Catalyst-Judge-Eval,
# tools/census_paths.py), по ТЕКСТУ ДИСПАТЧА — ровно тому, что сканирует
# образ. Больше ТРЁХ существующих файлов не называет ни один диспатч
# (1→111, 2→51, 3→2), поэтому три покрывают всё названное; бриф-подобный файл
# накрыт уже при двух (102 из 102). Тридцать тысяч знаков на файл — выше
# девятой децили (29079) при медиане 9462. Суммарный потолок = произведение
# двух других: он не связывает при нынешних числах (наибольшая нагрузка на
# корпусе 53356 знаков), а держит их СВЯЗАННЫМИ — поднять число файлов, не
# тронув суммарный, теперь нельзя молча.
attach_files = 3
attach_chars = 30000
attach_total = 90000

[[probe.judge.models]]
model = "deepseek-v4-flash"
effort = "high"
context_chars = 24000

[[probe.judge.models]]
model = "glm-5.3"
effort = "max"
context_chars = 24000

[[probe.judge.models]]
model = "claude-haiku-4-5-20251001"
context_chars = 12000

[probe.idle-watch]
dispatch_chars = 2000
fail_closed = false
window_min = 30
threshold = 1
cooldown_min = 30
live_kinds = ["local_agent", "remote_agent", "in_process_teammate"]
live_threshold = 1
live_recheck_ms = 60000

[[probe.idle-watch.models]]
model = "deepseek-v4-flash"
effort = "high"
context_chars = 24000

[[probe.idle-watch.models]]
model = "glm-5.3"
effort = "max"
context_chars = 24000
