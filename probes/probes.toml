[defaults]
max_tokens = 24000
timeout_ms = 240000
enforce = true
context_chars = 60000
retry_context_chars = 8000

[probe.judge]
dispatch_chars = 16000
fail_closed = true
# Судья решает, осталось ли внутри задачи решение. В 381 диспатче из 500
# (замер 2026-08-29, Catalyst-Judge-Eval) сама задача лежит в .md-файле, а
# диспатч несёт только указатель — и судья судил указатель. Настройка
# ПОИМЁННАЯ: ядро проб общее с наблюдателем флота, у которого в нагрузке путей
# нет, поэтому умолчание ядра — ноль, и включается это здесь.
# Числа — замер по 500 живым записям судьи (Catalyst-Judge-Eval,
# tools/census_paths.py), по ТЕКСТУ ДИСПАТЧА — ровно тому, что сканирует
# образ. Больше ТРЁХ существующих файлов не называет ни один диспатч
# (1→111, 2→51, 3→2), поэтому три покрывают всё названное; бриф-подобный файл
# накрыт уже при двух (102 из 102). Тридцать тысяч знаков на файл — выше
# девятой децили (29079) при медиане 9462. Суммарный потолок = произведение
# двух других: он не связывает при нынешних числах (наибольшая нагрузка на
# корпусе 53356 знаков), а держит их СВЯЗАННЫМИ — поднять число файлов, не
# тронув суммарный, теперь нельзя молча.
attach_files = 3
attach_chars = 30000
attach_total = 90000
# Сколько записей держит прополка ядра. Дефолт 500 -- скользящее окно, из
# которого записи выпадают САМИ, а метки на них живут дольше: замерено
# 2026-08-30, из 45 размеченных записей на диске оставалась 21, остальные
# 24 окно унесло безвозвратно, и каждый следующий замер шёл по незаметно
# другому набору. Решение юзера: поднять до 5000 («нам это нормально
# пока»). Цена по замеру: 36 КБ на запись в нынешней смеси (311 из 500 уже
# сжаты), то есть около 175 МБ на полном окне против 18 МБ сегодня.
# Потолок -- не замена долговечному дому размеченных записей
# (~/.local/share/claude-patch/judge-corpus, куда их уносит разметка): он
# отодвигает границу, а не отменяет её.
records_keep = 5000

[[probe.judge.models]]
model = "deepseek-v4-flash"
# ОСНОВАНИЕ ОТОЗВАНО 2026-08-30. Прежняя запись ссылалась на замер по набору AC
# (3 повтора, промт P6: `high` -- 4 пропуска из 81 и 8 неустойчивых, `xhigh` --
# 0 и 3). Набор AC признан негодным для этого вопроса: у 100% его записей вход
# судьи усечён ("[вырезано N знаков]"), а 36 из 43 записей несут бриф УКАЗАТЕЛЕМ,
# то есть готовность брифа по ним измерить нельзя в принципе. Ступень `xhigh`
# ОСТАВЛЕНА как есть -- снимать её без замера значит менять боевой контур по
# догадке, а не по факту. Новое основание даст только замер по годному набору.
effort = "xhigh"
context_chars = 24000

[[probe.judge.models]]
model = "glm-5.3"
effort = "max"
context_chars = 24000

[[probe.judge.models]]
# Ступень последней надежды. Стояла claude-haiku-4-5-20251001 и была ХУДШИМ
# судьёй из всех, кого мерили: набор AC, промт P6, 3 повтора -- 37 пропусков из
# 129 строк и 28 неустойчивых записей из 43 (у deepseek-v4-flash и gpt-5.6-terra
# на том же входе 0 пропусков). Решение юзера 2026-08-30: claude-модели из
# судейских ступеней исключить.
#
# ЦЕНА, которую эта замена берёт осознанно: haiku была единственной ступенью на
# ДРУГОМ канале (pool -- подписочный контур), остальные две и эта идут через
# прокси 127.0.0.1:8317. Теперь падение прокси гасит все три ступени разом, а
# при fail_closed = true это блокирует КАЖДЫЙ диспатч субагента. Терпимо
# ровно потому, что исполнители у нас тоже прокси-модели: их падение и так
# останавливает работу, и судья перестаёт быть отдельной точкой отказа.
# Возврат любой модели в ступень -- только по своему замеру, не по догадке.
model = "gpt-5.6-terra"
effort = "high"
context_chars = 24000

[probe.idle-watch]
dispatch_chars = 2000
fail_closed = false
window_min = 30
threshold = 1
cooldown_min = 30
live_kinds = ["local_agent", "remote_agent", "in_process_teammate"]
live_threshold = 1
live_recheck_ms = 60000

[[probe.idle-watch.models]]
model = "deepseek-v4-flash"
effort = "high"
context_chars = 24000

[[probe.idle-watch.models]]
model = "glm-5.3"
effort = "max"
context_chars = 24000

[probe.form]
fail_closed = false
records_keep = 300
# Список голов покрывает конвенции обоих потребителей: `# Бриф`, `# BRIEF #633`,
# `# #470 —`, `# TASK-684 —`.
brief_path = '(?:^|/)(?:\.r17-briefs|\.briefs|docs/review)/[^/]*brief[^/]*\.md$'
brief_ref = '[\w@.~/+-]*brief[\w@.+-]*\.md'
brief_head = '^#\s*(?:бриф|brief|#\d+(?![\w-])|task-\d+(?![\w-]))'
brief_tail = '<!-- BRIEF COMPLETE -->'
report_path = '(?:^|/)[^/]*report[^/]*\.md$'
fence = '^\s*(?:```|~~~)'
arm_line = '^\s*(?:[-*+]|\d+[.)]|\|)\s'
arm_ellipsis = '^\s*(?:…|\.\.\.)\s*'
arm_cmd = '^(?:[A-Z_][A-Z0-9_]*=\S+\s+)*(?:rch\s+exec\s+(?:--\s+)?)?(?:[A-Z_][A-Z0-9_]*=\S+\s+)*cargo\s+(build|test|check|clippy|doc|bench)(?=\s|$)'
arm_remote = 'RCH_REQUIRE_REMOTE=1\s+rch\s+exec'
arm_log = '>\s*\S+\s+2>&1'
witness_remote = '\[RCH\] remote'
witness_worker = 'Selected worker:'
# Границы слов -- лукараунды по \p{L}: \b в JS не знает кириллицы.
open_door = '(?<![\p{L}\p{N}_])(?:выбери|реши|на (?:твоё|ваше) усмотрение|если нужно|при необходимости|выясни|определи сам|проверь, (?:что|нужно ли)|verify|investigate|choose|decide|if needed|as appropriate|as you see fit)(?![\p{L}\p{N}_])'
# Голая альтернация: код оборачивает её в лукбехинд `(?<!(?:…)\s{0,16})` перед
# `open_door` — окно отрицания без среза строки.
negation = 'nothing to|no|not|never|нечего|ничего не|не'
rule_line = 'правил|rule|перечислител|enumerat|cargo check --all-targets|grep -r|(?<!\S)rg\s'
path_line = '^\s*(?:[-*]\s*)?`?[\w@.+-]+(?:/[\w@.+-]+)+\.\w+`?\s*(?:[—–-].*)?$'
path_lines_min = 10
decision_head = '^\s*РЕШЕНИЕ(?![\p{L}\p{N}_])'
decision_basis = 'основани'
decision_referent = '(?:\S+:\d+|\S+\.(?:log|md|diff)(?![\w-])|(?<![\w/])[0-9a-f]{7,40}(?![\w/]))'
# Границы слов -- лукараунды по \p{L}: \b в JS не знает кириллицы.
legalize = 'принять ограничение|accept(?:ed)? (?:the )?limitation|известное ограничение|оставляем как есть|deferred|отложено до|workaround|не чиним|(?<![\w-])as-is(?![\w-])'
git_commit = '(?<![\w.-])git\s+commit(?![\w-])'
git_commit_ok = '(?<!\S)--only(?!\S)'
git_msg = '''(?<!\S)-m\s*(?:"([^"]*)"|'([^']*)'|(\S+))'''
git_push = '(?<![\w.-])git\s+push(?![\w-])'
git_push_ok = '(?<!\S)origin\s+[\w./-]+:[\w./-]+(?!\S)'
git_force = '(?<!\S)(?:--force(?:-with-lease)?|-f)(?!\S)'
trailer_a = '^Session:'
trailer_b = '^Co-Authored-By:'
write_redirect = '''(?:>>?|tee(?:\s+-a)?)\s*["']?([^\s"'<>|;&]+\.md)'''
heredoc = '''<<-?\s*["']?(\w+)["']?[^\n]*\n([\s\S]*?)\n\1(?:\n|$)'''

# log_only -- инкубация на живом трафике; cancel включается здесь, без пересборки образа.
[probe.form.act]
A1 = "log_only"
A2 = "log_only"
A3 = "log_only"
A4 = "log_only"
B = "log_only"
C1 = "log_only"
C2 = "log_only"
F = "log_only"

[probe.form.text]
A1 = "бриф без хвостового маркера <!-- BRIEF COMPLETE --> последней непустой строкой — обрыв всегда выглядит самосогласованным"
A2 = "каждая арма cargo — только RCH_REQUIRE_REMOTE=1 rch exec -- … > <лог> 2>&1, свидетель площадки — строка [RCH] remote; Selected worker: свидетелем не является"
A3 = "исполнительский бриф не несёт открытых дверей: решения принимаются до диспатча"
A4 = "перечень путей без строки правила или перечислителя — перечень окажется неполным"
B = "решение без основания и референта (файл:строка, лог, диф, sha) не принимается"
C1 = "найденную проблему чинить всегда и полно; частичный фикс — только по ЯВНОМУ слову юзера"
C2 = "свидетель удалённой сборки — строка [RCH] remote, а не Selected worker:"
F = "коммит только --only по явным путям; push только origin <ветка>:<ветка> без принудительных форм; трейлеры Session: и Co-Authored-By: соседними строками"
