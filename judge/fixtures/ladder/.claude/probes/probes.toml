# Project layer of the fixture: the first rung is a deliberately nonexistent model,
# the second is live. The rung list is specified IN FULL — when layers merge the key
# value is replaced, not appended to, otherwise the home ladder would shift first.
[probe.judge]
timeout_ms = 60000
max_tokens = 3000
enforce = false

[[probe.judge.models]]
model = "totally-unknown-model-9x"
timeout_ms = 20000

[[probe.judge.models]]
model = "deepseek-v4-flash"
effort = "high"
